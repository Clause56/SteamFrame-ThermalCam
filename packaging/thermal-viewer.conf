# Options thermal-viewer reads at startup (command-line options override these).
# Used when SteamVR starts it, so edit here instead of on the command line.

# Headset view: true-scale, head-locked. Line it up with the real world:
#   hfov      camera horizontal field of view in degrees (TC001 ~56)
#   offset-y  metres up/down (the camera sits above your eyes: try 0.03)
--overlay-distance 1.0
--overlay-hfov 56
--overlay-offset-y 0.0
--overlay-alpha 0.85
--scale 2

# Look: palette ironbow|white|black|rainbow|arctic, gain equalize|camera|linear
--palette ironbow
--gain equalize
--detail 0.5

# Camera mounted upside down or mirrored? Uncomment one:
# --rotate 180
# --flip h

# Experimental, off by default until confirmed safe on the Frame:
# --dashboard                 control panel in the SteamVR dashboard
# --overlay-buffering double  alternate between two panels
