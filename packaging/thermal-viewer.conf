# Options thermal-viewer reads at startup (command-line options override these).
# Used when SteamVR starts it, so edit here instead of on the command line.
# Anything changed on the headset's dashboard panel is saved to
# thermal-viewer.saved and wins over this file; delete it to use these again.

# Headset view: true-scale, head-locked. Line it up with the real world:
#   hfov      camera horizontal field of view in degrees (TC001 ~56)
#   offset-x  metres right (+) / left (-)
#   offset-y  metres up (+) / down (-) (the camera sits above your eyes: try 0.03)
--overlay-distance 1.0
--overlay-hfov 56
--overlay-offset-x 0.0
--overlay-offset-y 0.0
--overlay-alpha 0.35
--overlay-size 0.95
--scale 2

# Look: palette arctic|ironbow|white|black|rainbow, gain equalize|camera|linear
--palette arctic
--gain equalize
--detail 0.5

# Camera mounted upside down or mirrored? Uncomment one:
# --rotate 180
# --flip h

# Uncomment to leave the control panel out of the SteamVR dashboard:
# --no-dashboard
